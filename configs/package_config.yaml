# HENU OS 3.0 — Package Collections Configuration
# Version: 3.0.0-alpha.1
# Base Distribution: Debian 13 (Trixie)

package_groups:
  base_system:
    - systemd
    - systemd-sysv
    - udev
    - dbus
    - sudo
    - curl
    - wget
    - ca-certificates
    - gnupg
    - live-boot
    - live-config
    - live-config-systemd
    - policykit-1
    - locales

  desktop_environment:
    - gnome-core
    - gnome-shell
    - gdm3
    - gnome-terminal
    - nautilus
    - network-manager-gnome
    - pipewire
    - pipewire-pulse
    - wireplumber
    - dconf-cli
    - dconf-gsettings-backend

  developer_tools:
    - build-essential
    - gcc
    - make
    - git
    - python3
    - python3-dev
    - python3-pip
    - cmake
    - debhelper
    - dpkg-dev

  cybersecurity_tools:
    - nmap
    - tshark
    - tcpdump
    - ufw
    - nftables

  ai_runtime:
    - python3-numpy
    - python3-scipy
    - libopenblas0

  system_utilities:
    - htop
    - tmux
    - tar
    - bash-completion
    - rsync
    - pciutils
    - usbutils

  hardware_drivers:
    - firmware-linux
    - firmware-linux-nonfree
    - firmware-iwlwifi
    - firmware-misc-nonfree
    - mesa-va-drivers
    - libgl1-mesa-dri

  desktop_applications:
    - firefox-esr
